metadata:
  id: "CKV2_GP_3"
  name: "Ephemeral resources carry an expires_at label for the sweeper (GCP)"
  category: "GENERAL_SECURITY"
scope:
  provider: "gcp"
definition:
  or:
    - cond_type: "attribute"
      resource_types: ["google_compute_instance", "google_compute_disk", "google_storage_bucket", "google_cloud_run_v2_service", "google_pubsub_topic", "google_pubsub_subscription", "google_secret_manager_secret", "google_kms_crypto_key", "google_redis_instance", "google_compute_forwarding_rule"]
      attribute: "labels.lifecycle"
      operator: "not_equals"
      value: "ephemeral"
    - cond_type: "attribute"
      resource_types: ["google_compute_instance", "google_compute_disk", "google_storage_bucket", "google_cloud_run_v2_service", "google_pubsub_topic", "google_pubsub_subscription", "google_secret_manager_secret", "google_kms_crypto_key", "google_redis_instance", "google_compute_forwarding_rule"]
      attribute: "labels.expires_at"
      operator: "exists"
